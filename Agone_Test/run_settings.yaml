mock_codex: false
# Leave unset to auto-discover Codex via AGONE_CODEX_EXECUTABLE, PATH, or ~/.codex/.sandbox-bin.
codex_executable: null
codex_timeout_seconds: 420
codex_smoke_timeout_seconds: 420
codex_preflight_timeout_seconds: 20
codex_exec_preflight_timeout_seconds: 20
build_timeout_seconds: 900
iterative_max_retries: 3
regenerative_compile_retry_max: 1
regenerative_retry_on: compilation_only
mutation_live_retry_max: 2

agents:
  - model: human
  - model: codex-cli

